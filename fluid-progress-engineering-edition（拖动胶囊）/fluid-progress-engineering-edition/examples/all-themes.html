<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fluid Progress · All Themes</title>
  <link rel="stylesheet" href="../assets/css/fluid-progress.css?v=1.3.1" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 20px; background: #eceef3; font-family: Arial, sans-serif; }
    main { width: min(900px, 100%); margin: 0 auto; display: grid; gap: 22px; }
    h1 { margin: 0 0 8px; }
    .item { display: grid; gap: 8px; }
    .label { color: #606473; font-size: 13px; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <h1>6 套主题</h1>
    <div class="item"><div class="label">珊瑚粉橙</div><div data-fluid-progress data-theme="coral-magenta" data-progress="58" data-title="NEURAL SYNC" data-subtitle="CORAL MAGENTA" data-draggable="true"></div></div>
    <div class="item"><div class="label">蓝紫</div><div data-fluid-progress data-theme="blue-purple" data-progress="64" data-title="NEURAL SYNC" data-subtitle="BLUE PURPLE" data-draggable="true"></div></div>
    <div class="item"><div class="label">绿黄</div><div data-fluid-progress data-theme="green-yellow" data-progress="70" data-title="NEURAL SYNC" data-subtitle="GREEN YELLOW" data-draggable="true"></div></div>
    <div class="item"><div class="label">蓝白青</div><div data-fluid-progress data-theme="blue-white-cyan" data-progress="52" data-title="NEURAL SYNC" data-subtitle="BLUE WHITE CYAN" data-draggable="true"></div></div>
    <div class="item"><div class="label">紫色藏蓝</div><div data-fluid-progress data-theme="purple-navy" data-progress="66" data-title="NEURAL SYNC" data-subtitle="PURPLE NAVY" data-draggable="true"></div></div>
    <div class="item"><div class="label">橙色黄绿</div><div data-fluid-progress data-theme="orange-yellowgreen" data-progress="61" data-title="NEURAL SYNC" data-subtitle="ORANGE YELLOW-GREEN" data-draggable="true"></div></div>
  </main>
  <script src="../assets/js/fluid-progress-themes.js?v=1.3.1"></script>
  <script src="../assets/js/fluid-progress.js?v=1.3.1"></script>
</body>
</html>
