<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fluid Progress · Minimal</title>
  <link rel="stylesheet" href="../assets/css/fluid-progress.css?v=1.3.1" />
  <style>
    html, body { margin: 0; min-height: 100%; background: transparent; }
    body { min-height: 100vh; display: grid; place-items: center; }
    .wrap { width: min(860px, calc(100vw - 36px)); }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="progressCard"
      data-fluid-progress
      data-theme="blue-white-cyan"
      data-progress="64"
      data-title="NEURAL SYNC"
      data-subtitle="ADAPTIVE INFERENCE STREAM"
      data-draggable="true"></div>
  </div>

  <script src="../assets/js/fluid-progress-themes.js?v=1.3.1"></script>
  <script src="../assets/js/fluid-progress.js?v=1.3.1"></script>
</body>
</html>
