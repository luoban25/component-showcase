<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ShipSwift · 视频第一屏复刻（画布 + 控制面板）</title>
<style>
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{margin:0;background:transparent}
  body{font-family:var(--app-font,-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif);color:var(--foreground,#111)}

  /* 画布：手机 + 控制面板整体居中；窗口不够宽时面板自动换行到手机下方 */
  .stage{width:673px;max-width:100%;margin:0 auto;padding:4px 0 8px;
         display:flex;flex-wrap:wrap;justify-content:center;gap:20px;align-items:flex-start;text-align:left}

  /* ---------- 手机 ---------- */
  .phone{position:relative;width:393px}
  .device{position:relative;width:393px;height:852px;border-radius:56px;padding:5px;
          background:linear-gradient(155deg,#3d3d41,#101012 40%,#2c2c30);
          box-shadow:0 34px 70px -22px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08) inset}
  .screen{position:relative;width:100%;height:100%;border-radius:51px;overflow:hidden;background:#000;color:#fff}
  /* 全屏 shader：WebGL 按设备像素比渲染，1:1 无插值；画布上没有任何叠加层 */
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block}

  .statusbar{position:absolute;top:12px;left:0;right:0;height:44px;display:flex;align-items:center;z-index:6;font-size:17px;font-weight:600}
  .statusbar > *{flex:1;display:flex;align-items:center}
  .statusbar .t{justify-content:center;color:rgba(0,0,0,.88)}
  .island{justify-content:center}
  .island i{display:block;width:114px;height:34px;border-radius:20px;background:#0F0F0F;position:relative}
  .island i:after{content:"";position:absolute;right:9px;top:5px;width:11px;height:11px;border-radius:50%;background:#1E1E1E}
  .statusbar .r{justify-content:center;gap:6px;color:#000}
  .sbw{width:17px;height:11px;background:currentColor;clip-path:polygon(0 100%,14% 100%,14% 68%,28% 68%,28% 100%,42% 100%,42% 46%,56% 46%,56% 100%,70% 100%,70% 26%,84% 26%,84% 100%,100% 100%,100% 0,0 0)}
  .sbb{width:26px;height:13px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.95}
  .sbb:after{content:"";position:absolute;inset:1.8px;right:6px;background:currentColor;border-radius:1.5px}
  .sbb:before{content:"";position:absolute;right:-3.4px;top:3.6px;width:1.7px;height:5px;background:currentColor;border-radius:0 1px 1px 0;opacity:.6}

  .navrow{position:absolute;top:72px;left:0;right:0;padding:0 17px;display:flex;justify-content:space-between;z-index:6}
  .glass{width:34px;height:34px;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;
         color:#fff;cursor:pointer;backdrop-filter:blur(14px) saturate(160%);
         background:rgba(255,255,255,.16);box-shadow:0 0 0 .8px rgba(255,255,255,.14) inset,0 2px 10px rgba(0,0,0,.18)}
  .glass:active{background:rgba(255,255,255,.3)}
  .glass.on{background:rgba(255,255,255,.34)}
  .glass svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}

  /* ---------- 画布上的控制面板（不在手机里） ---------- */
  .inspector{width:260px;border:1px solid var(--border,#d8d8de);border-radius:14px;
             background:var(--card,rgba(255,255,255,.55));overflow:hidden;
             transition:opacity .2s ease,transform .25s ease}
  .inspector.hidden{opacity:0;transform:translateX(8px);pointer-events:none}
  .inspector > header{display:flex;align-items:center;gap:8px;padding:11px 14px;font-size:13px;font-weight:600;
                      border-bottom:1px solid var(--border,#d8d8de);letter-spacing:.01em}
  .inspector > header .dot{width:7px;height:7px;border-radius:50%;background:#34C759;box-shadow:0 0 0 3px rgba(52,199,89,.16)}
  .inspector > header .tag{margin-left:auto;font-size:10.5px;font-weight:500;opacity:.5;letter-spacing:.06em;text-transform:uppercase}
  .grp{padding:11px 14px 13px;border-bottom:1px solid var(--border,#d8d8de)}
  .grp:last-of-type{border-bottom:0}
  .grp h4{margin:0 0 9px;font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
          color:var(--muted-foreground,#777);opacity:.85}
  .row{display:flex;align-items:center;gap:9px;min-height:26px;margin:7px 0;font-size:12.5px}
  .row > span.k{flex:0 0 74px;color:var(--muted-foreground,#666)}
  .row > span.v{flex:0 0 38px;text-align:right;font-variant-numeric:tabular-nums;
                color:var(--muted-foreground,#666);font-size:11.5px}
  .row select{flex:1;min-width:0;font:inherit;font-size:12.5px;color:inherit;padding:4px 6px;cursor:pointer;
              background:transparent;border:1px solid var(--border,#d8d8de);border-radius:7px}
  .row select:focus{outline:none;border-color:var(--accent,#888)}
  input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
        background:var(--border,#dcdce2);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
        background:var(--foreground,#333);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  input[type=color]{-webkit-appearance:none;appearance:none;width:24px;height:24px;padding:0;margin-left:auto;
        border:1px solid var(--border,#d8d8de);border-radius:6px;background:none;cursor:pointer}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:0;border-radius:5px}
  .inspector > footer{padding:10px 14px 12px;font-size:10.5px;line-height:1.6;color:var(--muted-foreground,#777);
                      border-top:1px solid var(--border,#d8d8de);opacity:.9}
  .inspector > footer code{font-family:ui-monospace,Menlo,monospace;font-size:10px}
</style>
</head>
<body>
<div class="stage">

  <!-- ================= 手机 ================= -->
  <div class="phone">
    <div class="device">
      <div class="screen">
        <canvas id="gl"></canvas>

        <div class="statusbar">
          <span class="t">6:57</span>
          <span class="island"><i></i></span>
          <span class="r"><span class="sbw"></span><span class="sbb"></span></span>
        </div>

        <div class="navrow">
          <button class="glass" id="back" title="NavigationStack 自动返回键">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
          </button>
          <button class="glass on" id="tune" title="显示 / 隐藏右侧控制面板">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M3.5 7h17M3.5 12h17M3.5 17h17"/>
              <circle cx="15" cy="7" r="2.6" fill="currentColor" stroke="none"/>
              <circle cx="7.5" cy="12" r="2.6" fill="currentColor" stroke="none"/>
              <circle cx="15" cy="17" r="2.6" fill="currentColor" stroke="none"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= 控制面板（画布上，不在手机里） ================= -->
  <aside class="inspector" id="inspector">
    <header><span class="dot"></span>Plasma Controls<span class="tag">live</span></header>

    <div class="grp">
      <h4>Pattern</h4>
      <div class="row"><span class="k">Pattern</span>
        <select id="pattern">
          <option value="smooth" selected>平滑渐变 <-默认</option>
          <option value="contour">等高线 · 硬边</option>
          <option value="bands">分层色带</option>
        </select>
      </div>
      <div class="row"><span class="k">Stripe</span><input type="range" id="stripe" min="0" max="0.6" step="0.02" value="0"><span class="v" id="stripe-v">0.00</span></div>
      <div class="row"><span class="k">Levels</span><input type="range" id="levels" min="4" max="40" step="1" value="16"><span class="v" id="levels-v">16</span></div>
      <div class="row"><span class="k">Chevron</span><input type="range" id="chev" min="0" max="1" step="0.02" value="0.85"><span class="v" id="chev-v">0.85</span></div>
    </div>

    <div class="grp">
      <h4>Style</h4>
      <div class="row"><span class="k">Style</span>
        <select id="style">
          <option value="jungle" selected>Jungle（视频·绿）</option>
          <option value="solar">Solar</option>
          <option value="prism">Prism</option>
          <option value="spectrum">Spectrum</option>
          <option value="ember">Ember</option>
          <option value="lilac">Lilac</option>
        </select>
      </div>
    </div>

    <div class="grp" id="palette"></div>

    <div class="grp">
      <h4>Field</h4>
      <div class="row"><span class="k">Scale</span><input type="range" id="scale" min="0.2" max="3" step="0.05" value="1"><span class="v" id="scale-v">1.00</span></div>
      <div class="row"><span class="k">Intensity</span><input type="range" id="intensity" min="0" max="2.5" step="0.05" value="1"><span class="v" id="intensity-v">1.00</span></div>
      <div class="row"><span class="k">Distortion</span><input type="range" id="distortion" min="0" max="3" step="0.05" value="1"><span class="v" id="distortion-v">1.00</span></div>
    </div>

    <footer>
      源码：<code>SWPackage/SWAnimation/SWMetal/SWPlasma.swift</code><br>
      参数面与 <code>SWPlasmaControlsSheet</code> 一致；Pattern 三项为复刻件自加。<br>
      点手机右上按钮可收起本面板。
    </footer>
  </aside>
</div>

<script>
/* ---- 五套预设调色板：逐字抄自 SWPlasma.swift 的 defaultPalette ---- */
const PALETTES = {
  solar:    ["#1A0500","#5A1208","#C44A20","#F08A3A","#FFC57A"],
  prism:    ["#1A0033","#7A1FB8","#FF1493","#FFD600","#00E5FF"],
  spectrum: ["#001A66","#3B0082","#6A0DAD","#C71585","#FF8C2E"],
  ember:    ["#050000","#4A0E00","#C44A0A","#FFA82E","#FFE08A"],
  lilac:    ["#2A0A4A","#6B4FA0","#C499D9","#F5C6E0","#FFEEEE"],
  /* 视频第一屏那台中机是绿色系（白核→薄荷青→中绿→深绿），补一套用于比对 */
  jungle:   ["#0B2016","#1E3126","#539760","#85FFE9","#FFFFFF"]
};

const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', {antialias:false, premultipliedAlpha:false, alpha:false, powerPreference:'high-performance'})
        || cv.getContext('experimental-webgl');

const VERT = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }`;

/* ============================================================
   场 f(p) → 平滑连续映射（默认）／量化 + 抗锯齿细线（等高线）
   ============================================================ */
const FRAG = `
precision highp float;
uniform vec2  u_res;
uniform float u_t, u_scale, u_inten, u_dist, u_levels, u_chev, u_mode;
uniform vec3  u_c0, u_c1, u_c2, u_c3, u_c4;
uniform vec2  u_px;          /* 一个物理像素对应的场坐标增量 */
uniform float u_stripe;      /* 细竖纹强度 */

float field(vec2 p){
    float t = u_t;
    vec2 q = p + vec2(u_dist * cos(p.y * 0.8 - t * 0.5) * 0.45,
                      u_dist * sin(p.x * 0.9 + t * 0.7) * 0.55);
    float tri = abs(fract(q.x * 0.62) - 0.5) * 2.0;      /* 三角波 → 人字形 */
    float y   = q.y + (tri - 0.5) * 0.9 * u_chev;

    float v = 0.55 * sin(q.x * 1.10 + t * 0.90)
            + 0.62 * sin(y   * 1.35 - t * 1.10)
            + 0.48 * sin(length(q * vec2(1.0, 1.25)) * 1.50 - t * 1.40)
            + 0.25 * sin((q.x + y) * 2.10 + t * 0.70);
    return v * 0.5 + 0.5;
}

vec3 ramp(float m){
    float f = clamp(m, 0.0, 0.999999) * 4.0;
    vec3 col = u_c0;
    col = mix(col, u_c1, clamp(f - 0.0, 0.0, 1.0));
    col = mix(col, u_c2, clamp(f - 1.0, 0.0, 1.0));
    col = mix(col, u_c3, clamp(f - 2.0, 0.0, 1.0));
    col = mix(col, u_c4, clamp(f - 3.0, 0.0, 1.0));
    return col;
}

void main(){
    vec2 uv = gl_FragCoord.xy / u_res;
    float aspect = u_res.x / u_res.y;
    vec2 p = vec2((uv.x - 0.5) * aspect, uv.y - 0.5) * u_scale * 6.0;

    float f  = field(p);
    float fx = field(p + vec2(u_px.x, 0.0));
    float fy = field(p + vec2(0.0, u_px.y));
    float g  = length(vec2(fx - f, fy - f));

    float N   = u_levels;
    float fN  = f * N;
    float lvl = floor(fN);
    float d   = fN - lvl;

    vec3 col;
    if (u_mode > 1.5) {
        /* 平滑渐变（默认）：等离子场连续映射，不量化、不画线、不加纹理 */
        col = ramp(clamp((f - 0.5) * (0.65 + u_inten * 0.95) + 0.5, 0.0, 1.0));
    } else {
        float m = (lvl + 0.5) / N;
        m = clamp((m - 0.5) * (0.55 + u_inten * 0.95) + 0.5, 0.0, 1.0);
        col = ramp(m);
        if (u_mode < 0.5) {
            float w    = clamp(g * N * 0.55, 0.0008, 0.5);
            float dist = min(d, 1.0 - d);
            float line = 1.0 - smoothstep(w * 0.25, w, dist);
            col *= mix(1.0, 0.42, line);
            col += vec3(0.55, 0.60, 0.58) * line * 0.22;
        }
    }

    col *= 1.0 - u_stripe * 0.5 * (0.5 + 0.5 * sin(gl_FragCoord.x * 1.7));

    gl_FragColor = vec4(col, 1.0);
}
`;

function compile(t, s){ const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh; }
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);

let P = { c: PALETTES.jungle.slice(), scale: 1.0, intensity: 1.0, distortion: 1.0,
          levels: 16, chev: 0.85, mode: 2, stripe: 0.0 };
let t = 0;
const hex2rgb = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
  gl.viewport(0,0,cv.width,cv.height);
}

function draw(){
  resize();
  const aspect = cv.width / cv.height, c = P.c.map(hex2rgb);
  gl.uniform2f(U('u_res'), cv.width, cv.height);
  gl.uniform2f(U('u_px'), (1.0/cv.width)*aspect*P.scale*6.0, (1.0/cv.height)*P.scale*6.0);
  gl.uniform1f(U('u_t'), t);
  gl.uniform1f(U('u_scale'), P.scale);
  gl.uniform1f(U('u_inten'), P.intensity);
  gl.uniform1f(U('u_dist'), P.distortion);
  gl.uniform1f(U('u_levels'), P.levels);
  gl.uniform1f(U('u_chev'), P.chev);
  gl.uniform1f(U('u_mode'), P.mode);
  gl.uniform1f(U('u_stripe'), P.stripe);
  for (let i=0;i<5;i++) gl.uniform3fv(U('u_c'+i), c[i]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

let last = 0;
function loop(ts){ if (ts - last > 16){ t += 0.010; draw(); last = ts; } requestAnimationFrame(loop); }

/* ---- 控制面板 ---- */
const paletteBox = document.getElementById('palette');
paletteBox.innerHTML = '<h4>Palette</h4>' + [0,1,2,3,4].map(i=>
  `<div class="row"><span class="k">Color ${i+1}</span><input type="color" data-c="${i}" value="${P.c[i]}"></div>`).join('');
const syncPalette = () => paletteBox.querySelectorAll('input[type=color]').forEach(i=>i.value = P.c[+i.dataset.c]);

paletteBox.addEventListener('input', e=>{
  if (e.target.type === 'color'){ P.c[+e.target.dataset.c] = e.target.value;
    document.getElementById('style').value = ''; draw(); }
});
document.getElementById('style').addEventListener('change', e=>{
  P.c = PALETTES[e.target.value].slice(); syncPalette(); draw(); });

const bind = (id, key, fmt=v=>v.toFixed(2)) => {
  const el = document.getElementById(id), out = document.getElementById(id+'-v');
  el.value = P[key];
  if (out) out.textContent = fmt(P[key]);
  el.addEventListener('input', ()=>{ P[key] = parseFloat(el.value); if (out) out.textContent = fmt(P[key]); draw(); });
};
bind('scale','scale'); bind('intensity','intensity'); bind('distortion','distortion');
bind('levels','levels', v=>String(v)); bind('chev','chev'); bind('stripe','stripe');

document.getElementById('pattern').addEventListener('change', e=>{
  P.mode = {smooth:2, contour:0, bands:1}[e.target.value]; draw();
});

/* 手机上那个滑杆按钮：收起 / 展开画布上的面板 */
const inspector = document.getElementById('inspector'), tuneBtn = document.getElementById('tune');
tuneBtn.addEventListener('click', ()=>{
  inspector.classList.toggle('hidden');
  tuneBtn.classList.toggle('on', !inspector.classList.contains('hidden'));
});

draw();
requestAnimationFrame(loop);
window.addEventListener('resize', draw);
</script>
</body>
</html>
