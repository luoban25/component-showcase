  document.querySelectorAll('.ARCP').forEach(function(p){ p.setAttribute('d', ARC); });

  var W0 = 250, W1 = 496;   // 数值区 x 范围（实测 254..481 + 余量）
  function wipe(){
    var t0 = performance.now(), dur = 900, r = document.getElementById('wipeR');
    (function step(now){
      var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      r.setAttribute('width', (W0 + (W1 - W0) * e).toFixed(1));
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }
  function redraw(){
    var p = document.getElementById('lineCore');
    p.style.strokeDasharray = '2400'; p.style.strokeDashoffset = '2400';
    void p.getBoundingClientRect();
    p.style.transition = 'stroke-dashoffset 1.1s ease-in-out'; p.style.strokeDashoffset = '0';
  }
  document.querySelector('.pill').addEventListener('click', function(){
    var r = this.querySelector('rect:nth-of-type(2)');
    r.setAttribute('fill', r.getAttribute('fill') === '#3A4934' ? '#46573F' : '#3A4934');
  });
  document.getElementById('lineCore').addEventListener('click', redraw);
  document.getElementById('bigval').addEventListener('click', function(){
    var r = document.getElementById('wipeR');
    r.setAttribute('width', '0');
    void r.getBoundingClientRect();
    wipe();
  });
})();
</script>
<script>
/* 小视口兜底：窗口小于设计尺寸时按比例缩放（不裁切、不产生滚动条）。
   视口 >= 736x920 时不施加任何 transform —— 保证 736x920 下像素与设计稿 1:1，MAE 不受影响。 */
(function(){
  var st = document.getElementById('stage');
  function fit(){
    var s = Math.min(1, innerWidth / 736, innerHeight / 920);
    if (s < 0.995) { st.style.transformOrigin = '0 0'; st.style.transform = 'scale(' + s.toFixed(4) + ')'; }
    else { st.style.transform = 'none'; }
  }
  fit();
  addEventListener('resize', fit);
})();
</script>
